<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL·ALBA | ARTE • FE • DEVOCIÓN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cream: '#ffecc3',
                            brown: '#352319',
                            brownLight: '#5c4033',
                            creamDark: '#f5dfb1',
                        },
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body {
            background-color: #ffecc3;
            color: #352319;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass { background: rgba(255, 236, 195, 0.8); backdrop-filter: blur(10px); }

        /* Smooth Transitions Global */
        .transition-smooth { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform, opacity; }

        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .product-card:hover img { transform: scale(1.05); transition: transform 0.6s cubic-bezier(0.33, 1, 0.68, 1); }

        .fade-in { animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal Animations */
        .animate-fade-in { animation: modalFadeIn 0.3s ease-out forwards; will-change: opacity; }
        @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .animate-scale-up { animation: modalScaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; will-change: transform, opacity; }
        @keyframes modalScaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Floating animation for the main logo - Enhanced for elegance */
        .float-logo {
            animation: float 8s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            33% { transform: translateY(-10px) rotate(0.5deg) scale(1.01); }
            66% { transform: translateY(-5px) rotate(-0.5deg) scale(0.99); }
        }

        .logo-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,236,195,0.4) 0%, transparent 70%);
            filter: blur(40px);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite;
            will-change: opacity, transform;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Animación personalizada para el menú móvil */
        .mobile-menu-enter {
            animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efecto elegante para los botones del menú móvil */
        .mobile-link-premium {
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .mobile-link-premium:hover {
            color: #5c4033;
            transform: translateX(10px);
        }
        .mobile-link-premium::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #5c4033;
            transition: width 0.3s ease;
        }
        .mobile-link-premium:hover::after {
            width: 100%;
        }

        /* Filtro para ajustar el color de la imagen a la marca */
        .brand-color-filter {
            filter: sepia(1) saturate(1.5) hue-rotate(340deg) brightness(0.7) contrast(1.2);
        }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATA ---
        const categories = ["Todos", "Vírgenes", "Santos", "Figuras religiosas", "Decoración", "Otros"];
        const products = [
            { id: 1, name: "Virgen de Guadalupe", category: "Vírgenes", description: "Figura detallada en acabado seda, ideal para altares personales.", price: 25.00, image: "assets/images/catalogo/Producto 1.jpg" },
            { id: 2, name: "San Judas Tadeo", category: "Santos", description: "Representación clásica del patrón de las causas difíciles.", price: 20.00, image: "assets/images/catalogo/Producto 2.jpg" },
            { id: 3, name: "Cruz Minimalista", category: "Decoración", description: "Diseño contemporáneo que fusiona fe y modernidad.", price: 15.00, image: "assets/images/catalogo/Producto 3.jpg" },
            { id: 4, name: "Sagrada Familia", category: "Figuras religiosas", description: "Set de tres piezas con acabado premium en blanco marfil.", price: 45.00, image: "assets/images/catalogo/Producto 4.jpg" },
            { id: 5, name: "Rosario Articulado", category: "Otros", description: "Pieza de devoción impresa con precisión milimétrica.", price: 12.00, image: "assets/images/catalogo/Producto 5.jpg" },
            { id: 6, name: "Corazón de María", category: "Vírgenes", description: "Detalle delicado para regalo o meditación.", price: 18.00, image: "assets/images/catalogo/Producto 6.jpg" },
        ];

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [isOpen, setIsOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'glass py-3 shadow-sm' : 'py-5 bg-transparent'}`}>
                    <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">

                        {/* Mobile Menu Button (Left on mobile) */}
                        <div className="md:hidden order-1">
                            <button onClick={() => setIsOpen(!isOpen)} className="text-brand-brown p-2 transition-transform active:scale-90">
                                <i data-lucide={isOpen ? "x" : "menu"}></i>
                            </button>
                        </div>

                        {/* Logo (Right on mobile, Left on desktop) */}
                        <a href="#inicio" className="block order-2 md:order-1">
                            <img src="assets/images/LOGO-ALALBA-NAVBAR.png" alt="AL·ALBA Logo" className="h-8 md:h-12 w-auto object-contain transition-transform hover:scale-105 duration-300" />
                        </a>

                        {/* Desktop Menu */}
                        <div className="hidden md:flex space-x-8 font-medium text-sm uppercase tracking-widest order-3">
                            <a href="#inicio" className="hover:text-brand-brownLight transition-colors">Inicio</a>
                            <a href="#catalogo" className="hover:text-brand-brownLight transition-colors">Catálogo</a>
                            <a href="#contacto" className="hover:text-brand-brownLight transition-colors">Contacto</a>
                        </div>
                    </div>

                    {/* Mobile Dropdown with Dynamic Effects */}
                    {isOpen && (
                        <div className="md:hidden absolute top-full left-0 w-full bg-brand-cream border-t border-brand-brown/10 py-8 px-6 flex flex-col space-y-6 text-center font-medium uppercase tracking-widest text-sm shadow-2xl mobile-menu-enter">
                            <a href="#inicio" onClick={() => setIsOpen(false)} className="py-2 mobile-link-premium transition-all">Inicio</a>
                            <a href="#catalogo" onClick={() => setIsOpen(false)} className="py-2 mobile-link-premium transition-all">Catálogo</a>
                            <a href="#contacto" onClick={() => setIsOpen(false)} className="py-2 mobile-link-premium transition-all">Contacto</a>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => (
            <section id="inicio" className="relative min-h-screen flex items-center justify-center px-6 pt-20 overflow-hidden">
                <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 lg:gap-12 items-center">
                    <div className="fade-in space-y-6 md:space-y-8 text-center md:text-left z-10">
                        <h1 className="font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold leading-tight text-brand-brown">
                            Fe, diseño y <br className="hidden sm:block" /><span className="italic font-normal">devoción</span> en cada detalle.
                        </h1>
                        <p className="text-base sm:text-lg text-brand-brown opacity-80 max-w-lg mx-auto md:mx-0 leading-relaxed">
                            En AL·ALBA damos forma a la fe a través de la impresión 3D. Creamos piezas decorativas y artículos religiosos con dedicación, cuidando cada detalle para convertir la devoción en algo que puedas tener siempre cerca.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                            <a href="#catalogo" className="bg-brand-brown text-brand-cream px-8 py-4 rounded-full font-semibold text-center hover:bg-brand-brownLight transition-all transform hover:-translate-y-1 shadow-lg w-full sm:w-auto">
                                Explorar Catálogo
                            </a>
                            <a href="#contacto" className="border-2 border-brand-brown text-brand-brown px-8 py-4 rounded-full font-semibold text-center hover:bg-brand-brown hover:text-brand-cream transition-all transform hover:-translate-y-1 w-full sm:w-auto">
                                Contactar
                            </a>
                        </div>
                    </div>
                    <div className="relative fade-in" style={{animationDelay: '0.3s'}}>
                        <div className="absolute -top-10 -left-10 w-64 h-64 bg-brand-creamDark rounded-full blur-3xl opacity-50"></div>

                        {/* Elemento Logo: Imagen*/}
                        <div className="relative z-10 flex justify-center items-center w-full h-[300px] sm:h-[500px] md:h-[600px] lg:h-[650px]">
                            <div className="relative transition-all duration-500 float-logo">
                                <div className="logo-glow"></div>
                                <img
                                    src="assets/images/LOGO-ALALBA.png"
                                    className="w-64 h-auto sm:w-80 md:w-[450px] lg:w-[650px] object-contain shadow-md transition-all duration-700 hover:scale-105 hover:shadow-lg relative z-10"
                                    alt="Logo AL·ALBA"
                                    onError={(e) => {
                                        console.error("Error cargando logo:", e);
                                    }}
                                />
                            </div>
                            <div className="absolute inset-0 bg-gradient-to-t from-brand-cream via-transparent to-transparent pointer-events-none"></div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Values = () => (
            <section className="py-16 md:py-24 bg-brand-creamDark/30 px-6">
                <div className="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                    {[
                        { title: "Diseño con propósito", icon: "heart", desc: "Cada pieza es pensada para inspirar paz y reflexión." },
                        { title: "Tecnología e innovación", icon: "cpu", desc: "Utilizamos la vanguardia de la impresión 3D para máxima precisión." },
                        { title: "Devoción en cada detalle", icon: "sparkles", desc: "Cuidado artesanal en el acabado final de cada artículo." }
                    ].map((val, i) => (
                        <div key={i} className="text-center p-8 rounded-2xl bg-brand-cream hover:shadow-md transition-shadow group">
                            <div className="w-16 h-16 bg-brand-brown text-brand-cream rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                                <i data-lucide={val.icon}></i>
                            </div>
                            <h3 className="font-serif text-xl font-bold mb-4">{val.title}</h3>
                            <p className="opacity-70 text-sm sm:text-base">{val.desc}</p>
                        </div>
                    ))}
                </div>
            </section>
        );

        const Catalog = ({ onProductClick }) => {
            const [filter, setFilter] = useState("Todos");
            const filtered = filter === "Todos" ? products : products.filter(p => p.category === filter);

            return (
                <section id="catalogo" className="py-16 md:py-24 px-6 max-w-6xl mx-auto">
                    <div className="text-center mb-12 md:mb-16">
                        <h2 className="font-serif text-3xl md:text-4xl font-bold mb-4">Nuestro Catálogo</h2>
                        <div className="flex flex-wrap justify-center gap-2 sm:gap-3 mt-8">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-4 py-2 rounded-full text-xs sm:text-sm transition-all ${filter === cat ? 'bg-brand-brown text-brand-cream shadow-md' : 'bg-white text-brand-brown hover:bg-brand-creamDark'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                        {filtered.map(p => (
                            <div key={p.id} onClick={() => onProductClick(p)} className="product-card bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 group transform hover:-translate-y-2 cursor-pointer">
                                <div className="relative h-80 sm:h-[450px] overflow-hidden">
                                    <img src={p.image} className="w-full h-full object-cover transition-transform duration-500" alt={p.name} />
                                </div>
                                <div className="p-6 sm:p-8">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-serif text-xl sm:text-2xl font-bold text-brand-brown leading-tight">{p.name}</h3>
                                        <span className="font-bold text-base sm:text-lg text-brand-brown ml-4 whitespace-nowrap">{p.price}€</span>
                                    </div>
                                    <p className="text-sm opacity-70 leading-relaxed italic">{p.description}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contacto" className="py-16 md:py-24 px-6 bg-brand-brown text-brand-cream">
                <div className="max-w-3xl mx-auto bg-brand-cream text-brand-brown rounded-[2.5rem] p-8 sm:p-12 text-center shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-4 opacity-10">
                        <i data-lucide="mail" className="w-24 h-24 sm:w-32 sm:h-32"></i>
                    </div>
                    <h2 className="font-serif text-3xl sm:text-4xl font-bold mb-6">Estamos aquí para ti.</h2>
                    <p className="text-base sm:text-lg opacity-80 mb-4 leading-relaxed">¿Te interesa alguna de nuestras piezas o tienes una idea en mente?</p>
                    <p className="text-sm sm:text-base font-medium text-brand-brown/70 mb-10 sm:mb-12 italic">
                        Puedes solicitar cualquier pieza directamente desde nuestro catálogo haciendo clic en el producto.
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <a href="https://wa.me/34695604563" target="_blank" className="flex items-center justify-center gap-3 p-4 bg-brand-brown text-brand-cream rounded-full shadow-sm hover:bg-brand-brownLight transition-all group">
                            <i data-lucide="message-circle" className="group-hover:scale-110 transition-transform"></i>
                            <span className="font-semibold">Contactar</span>
                        </a>
                        <a href="https://www.instagram.com/alalba.studio?obrf=NmEydHduMXVhaXhj" target="_blank" className="flex items-center justify-center gap-3 p-4 bg-brand-brown text-brand-cream rounded-full shadow-sm hover:bg-brand-brownLight transition-all group">
                            <i data-lucide="instagram" className="group-hover:scale-110 transition-transform"></i>
                            <span className="font-semibold">Visitar Instagram</span>
                        </a>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 px-6 border-t border-brand-brown/10 bg-brand-cream">
                <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                    <div className="text-center md:text-left">
                        <img src="assets/images/LOGO-ALALBA-NAVBAR.png" alt="AL·ALBA Logo" className="h-8 md:h-12 w-auto object-contain mx-auto md:mx-0 mb-2" />
                        <p className="text-sm opacity-60 italic">"Dando forma a la fe con tecnología y corazón."</p>
                    </div>
                    <div className="flex flex-wrap justify-center gap-4 sm:gap-6 text-xs sm:text-sm font-medium uppercase tracking-widest">
                        <a href="#inicio" className="hover:underline">Inicio</a>
                        <a href="#catalogo" className="hover:underline">Catálogo</a>
                        <a href="#contacto" className="hover:underline">Contacto</a>
                    </div>
                    <div className="text-xs opacity-50">
                        © {new Date().getFullYear()} AL·ALBA. Todos los derechos reservados.
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [customerName, setCustomerName] = useState("");
            const [isNaming, setIsNaming] = useState(false);

            useEffect(() => {
                lucide.createIcons();
            }, [selectedProduct, isNaming]);

            const handleWhatsAppOrder = (product) => {
                const phoneNumber = "34695604563";
                const catalogUrl = `${window.location.origin}${window.location.pathname}#catalogo`;
                const nameToUse = customerName.trim() || "Cliente";
                const message = `¡Hola AL·ALBA! Mi nombre es *${nameToUse}*. Estoy interesado en adquirir la pieza: *${product.name}* con un valor de *${product.price}€*. \n\nPuedes ver el catálogo completo aquí: ${catalogUrl}`;
                window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
            };

            return (
                <div className="min-h-screen font-sans">
                    <Navbar />
                    <Hero />
                    <Values />
                    <Catalog onProductClick={(p) => {
                        setSelectedProduct(p);
                        setIsNaming(false);
                        setCustomerName("");
                    }} />
                    <Contact />
                    <Footer />

                    {/* Product Modal */}
                    {selectedProduct && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="relative bg-brand-cream rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl transform transition-all animate-scale-up">
                                <button
                                    onClick={() => setSelectedProduct(null)}
                                    className="absolute top-4 right-4 z-50 p-3 bg-brand-brown text-brand-cream rounded-full hover:bg-brand-brownLight transition-all shadow-xl active:scale-90"
                                    aria-label="Cerrar"
                                >
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>

                                <div className="flex flex-col md:grid md:grid-cols-2 overflow-y-auto max-h-[85vh] md:max-h-none">
                                    <div className="h-[300px] sm:h-[400px] md:h-[600px] lg:h-[700px] bg-white flex items-center justify-center shrink-0">
                                        <img src={selectedProduct.image} alt={selectedProduct.name} className="max-w-full max-h-full object-contain drop-shadow-xl" />
                                    </div>
                                    <div className="p-6 sm:p-12 flex flex-col justify-center space-y-6">
                                        <div className="space-y-2">
                                            <span className="text-xs uppercase tracking-widest font-bold opacity-60">{selectedProduct.category}</span>
                                            <h2 className="font-serif text-2xl sm:text-3xl md:text-4xl font-bold text-brand-brown">{selectedProduct.name}</h2>
                                        </div>
                                        <p className="text-base sm:text-lg opacity-80 leading-relaxed italic">{selectedProduct.description}</p>
                                        <div className="text-2xl sm:text-3xl font-bold text-brand-brown">{selectedProduct.price}€</div>

                                        {!isNaming ? (
                                            <button
                                                onClick={() => setIsNaming(true)}
                                                className="bg-brand-brown text-brand-cream px-8 py-4 rounded-full font-semibold text-center hover:bg-brand-brownLight transition-all transform hover:-translate-y-1 shadow-lg block w-fit"
                                            >
                                                Pedir por WhatsApp
                                            </button>
                                        ) : (
                                            <div className="space-y-4 animate-fade-in">
                                                <p className="text-sm font-medium text-brand-brown">Para personalizar tu pedido, por favor dinos tu nombre:</p>
                                                <div className="flex flex-col sm:flex-row gap-2">
                                                    <input
                                                        type="text"
                                                        value={customerName}
                                                        onChange={(e) => setCustomerName(e.target.value)}
                                                        placeholder="Tu nombre..."
                                                        className="flex-1 px-4 py-3 rounded-full border-2 border-brand-brown/20 focus:border-brand-brown outline-none bg-white/50 transition-all"
                                                        autoFocus
                                                    />
                                                    <button
                                                        onClick={() => {
                                                            handleWhatsAppOrder(selectedProduct);
                                                            setSelectedProduct(null);
                                                        }}
                                                        disabled={!customerName.trim()}
                                                        className={`px-6 py-3 rounded-full font-semibold transition-all ${customerName.trim() ? 'bg-brand-brown text-brand-cream hover:bg-brand-brownLight shadow-md' : 'bg-brand-brown/30 text-brand-brown/50 cursor-not-allowed'}`}
                                                    >
                                                        Confirmar
                                                    </button>
                                                </div>
                                                <button
                                                    onClick={() => setIsNaming(false)}
                                                    className="text-xs underline opacity-60 hover:opacity-100 transition-opacity"
                                                >
                                                    Volver
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
